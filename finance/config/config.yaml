  - {name: Capital One Mastercard minimum,            kind: card,  balance: 9685.00,  monthly_payment: 275.00,  payment_day: 18, annual_rate: 0.198,  critical: true}
  - {name: TSC510 capital lease (De Lage Landen),     kind: lease, balance: 7489.40,  monthly_payment: 539.85,  payment_day: 7,  annual_rate: 0.10,   critical: true}
  - {name: Lending Loop (CONFIRM payment is running), kind: loan,  balance: 11099.78, monthly_payment: 1336.92, payment_day: 15, annual_rate: 0.15,   critical: true}
  - {name: MBNA,                                      kind: card,  balance: 542.80,   monthly_payment: 15.00,   payment_day: 20, annual_rate: 0.1999, critical: true}
  - {name: CEBA loan (real obligation to confirm),    kind: loan,  balance: 59875.00, monthly_payment: 0,       payment_day: 31, annual_rate: 0.0,    critical: true}
  - {name: Accrued property taxes (City of Quesnel),  kind: tax,   balance: 18461.95, monthly_payment: 0,       payment_day: 1,  annual_rate: 0.0,    critical: true}

recurring:
  - {name: Monthly pre-authorised block (Telus, Shaw, Xplore, QuickBooks, Adobe, Apple, Google Ads, WordPress, Equifax, Anthropic), amount: 1386.11, direction: out, cadence: monthly, next_date: 2026-09-07, category: overhead, critical: true}
  - {name: Rent, amount: 1300.00, direction: out, cadence: monthly, next_date: 2026-10-01, category: overhead, critical: true}
  - {name: Fixed overhead (meals, telephone, utilities, office, bank charges), amount: 1730.00, direction: out, cadence: monthly, next_date: 2026-09-15, category: overhead}
  - {name: CEBA repayment to keep the forgivable portion (confirm balance with TBJ), amount: 59875.00, direction: out, cadence: monthly, next_date: 2026-12-31, end_date: 2026-12-31, category: debt, critical: true}

