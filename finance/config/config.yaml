  - {name: Erin Mickey,   position: Director of Finance}
  - {name: Ed Smith,      position: General Labourer}
  - {name: Don Oviatt,    position: Gravel Truck Operator}
  - {name: Liam Mickey,   position: Labourer}

equipment:
