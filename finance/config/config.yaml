# RAM Excavating financial system: live configuration. No secrets in here; those are environment variables.
company:
  name: RAM Excavating Limited
  fiscal_year_end_month: 5
  gst_rate: 0.05
  labour_burden_factor: 1.35

paths:
  data_dir: ./data
  cost_codes_csv: ./config/cost_codes.csv       # optional local fallback; the live list is pulled from SharePoint (seed_sources)
  vendors_csv: ./config/vendors.csv

sharepoint:
  site: BUSINESSEXECUTIVE
  library: BUSINESS_EXEC
  finance_root: 01_BUSINESS_FINANCE/09_REPORTING
  receipts: 01_BUSINESS_FINANCE/09_REPORTING/06_RECEIPTS
  ap_invoices: 01_BUSINESS_FINANCE/09_REPORTING/05_AP_INVOICES
  timesheets: 01_BUSINESS_FINANCE/04_PAYROLL/01_TIMESHEETS
  bank_statements: 01_BUSINESS_FINANCE/09_REPORTING/07_STATEMENTS
  qb_reports: 01_BUSINESS_FINANCE/09_REPORTING/02_RAM_FINANCIAL_UPDATES
  cashflow: 01_BUSINESS_FINANCE/09_REPORTING/03_CASHFLOW_TRACKING
  state: 01_BUSINESS_FINANCE/09_REPORTING/03_CASHFLOW_TRACKING/_ramfin
  unfiled: 01_BUSINESS_FINANCE/09_REPORTING/06_RECEIPTS/00_UNFILED_NEEDS_REVIEW
  projects_site: PROJECTS
  projects_library: PROJECTS
  projects_active: 01_ACTIVE_PROJECTS
  equipment_site: RESOURCES                      # the maintenance routine files here: <equipment>/<unit>/01_SERVICE_RECORDS
  equipment_library: RESOURCES
  equipment: 02_RESOURCES/04_EQUIPMENT/02_MAINTENANCE/01_SERVICE-REPAIR/02_REPAIR_RECORDS

seed_sources:                                    # workbooks RAM already keeps; ramfin init reads them
  cost_codes_xlsx:
    library: projects
    path: 01_ACTIVE_PROJECTS/260102_DUNKLEY_LUMBER_2026/05.1 Acct & Billing/5.1.08 Budget & Cost Codes/2025_Standard Cost Codes List Rev 1.xlsx
  ap_register_xlsx: 01_BUSINESS_FINANCE/09_REPORTING/03_CASHFLOW_TRACKING/RAM_AP_REGISTER.xlsx
  cashflow_tool_xlsx: 01_BUSINESS_FINANCE/09_REPORTING/03_CASHFLOW_TRACKING/RAM_CASHFLOW_TOOL.xlsx

sources:
  mailboxes:
    - rmickey@ramexcavating.ca
    - accounts@ramexcavating.ca
    - emickey@ramexcavating.ca
  legacy_mailbox:
    enabled: true
    address: ramcontracting@live.ca
  legacy_imap:
    enabled: false
  camscanner_folder: 01_BUSINESS_FINANCE/09_REPORTING/06_RECEIPTS/01_CAMSCANNER_INBOX
  attachment_types: [pdf, jpg, jpeg, png, heic, xlsx, xls, csv]

bank_accounts:
  - {key: rbc_chq,  name: RBC Business Chequing,  institution: RBC,         kind: chequing,   import_format: rbc_csv}
  - {key: td_chq,   name: TD Chequing,            institution: TD,          kind: chequing,   import_format: td_csv}
  - {key: td_loc,   name: TD Operating Line,      institution: TD,          kind: loc,        limit: 60000}
  - {key: td_visa,  name: TD Business Visa,       institution: TD,          kind: card,       limit: 25000, import_format: td_csv}
  - {key: cap_one,  name: Capital One Mastercard, institution: Capital One, kind: card,       limit: 10000, import_format: capitalone_csv}
  - {key: td_di,    name: TD Direct Investing,    institution: TD,          kind: investment}

forecast:
  horizon_weeks: 13
  basis: position
  floor_amount: -60000            # decided 2026-09-02: the floor is the operating line limit
  tight_band: 10000
  loc_limit: 60000
  payroll:
    cadence_days: 14
    anchor_pay_date: 2026-09-04   # Fridays: Aug 7, Aug 21, Sep 4, Sep 18, Oct 2, Oct 16, Oct 30 ...
    estimated_net_per_run: 8000
    cra_remit_day_of_month: 15
    estimated_cra_remit: 2570.09  # ACG revised 260827
  never_defer_categories: [payroll, cra, debt, critical_vendor, wsbc, tax, lease, insurance]

jobs:
  - {job_no: "240617",    name: MDM Kinchant,                client: MDM Construction,          sharepoint_folder: 01_ACTIVE_PROJECTS/240617_MDM_KSLIH}
  - {job_no: "241115",    name: IDL Consulting,              client: IDL Projects,              sharepoint_folder: 01_ACTIVE_PROJECTS/241115_IDL_CONSULTING_2024-2025}
  - {job_no: "260102",    name: Dunkley Lumber,              client: Dunkley Lumber,            sharepoint_folder: 01_ACTIVE_PROJECTS/260102_DUNKLEY_LUMBER_2026}
  - {job_no: "260710",    name: FFP Survey,                  client: Foothills Forest Products, sharepoint_folder: 01_ACTIVE_PROJECTS/260710_FFP_SURVEY}
  - {job_no: "250601-01", name: General Business Operations, client: RAM (overhead)}
  - {job_no: "250601-02", name: Equipment Costs,             client: RAM (equipment)}

