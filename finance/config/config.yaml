  - {unit_id: EX-02,  description: Excavator}
  - {unit_id: EX-03,  description: Excavator}
  - {unit_id: DT-02,  description: Dump / gravel truck}
  - {unit_id: SE-01,  description: Service / shop equipment}
  - {unit_id: GPS-01, description: GPS / survey equipment}
