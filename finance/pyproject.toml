[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramfin"
version = "0.1.0"
description = "RAM Excavating financial operations system: receipts, AP/AR, bank reconciliation, timesheets, job costing, 13-week cash flow."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3.0",
    "msal>=1.28",
    "requests>=2.31",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=10",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ramfin = "ramfin.cli:main"

[tool.setuptools.packages.find]
include = ["ramfin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
