<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --card: #ffffff; --field: #ffffff; --field-2: #f3f4f6; --group: #f9fafb; --ink: #111827; --muted: #6b7280; --line: #e5e7eb;
  --brand: #1f2937; --brand-ink: #ffffff; --accent: #e8731a; --accent-ink: #fff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  --tag-bg: #eef2ff; --tag-ink: #3730a3; --tag-eq-bg: #fff3e8; --tag-eq-ink: #9a3412; --tag-ok-bg: #ecfdf5; --tag-warn-bg: #fffbeb; --sel: #fff7ed; --sent: #ecfdf5;
  --radius: 14px; --tap: 48px;
}
/* dark: tokens only. System dark applies unless the host stamped an explicit light choice; an explicit dark stamp always wins. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --card: #171e28; --field: #1f2937; --field-2: #111827; --group: #111827; --ink: #e5e7eb; --muted: #9ca3af; --line: #2a3340;
    --tag-bg: #1e1b4b; --tag-ink: #c7d2fe; --tag-eq-bg: #3b2a1a; --tag-eq-ink: #fdba74; --tag-ok-bg: #0f2e22; --tag-warn-bg: #3a2a0a; --sel: #3b2a1a; --sent: #0f2e22;
    --ok: #86efac; --warn: #fcd34d;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --card: #171e28; --field: #1f2937; --field-2: #111827; --group: #111827; --ink: #e5e7eb; --muted: #9ca3af; --line: #2a3340;
  --tag-bg: #1e1b4b; --tag-ink: #c7d2fe; --tag-eq-bg: #3b2a1a; --tag-eq-ink: #fdba74; --tag-ok-bg: #0f2e22; --tag-warn-bg: #3a2a0a; --sel: #3b2a1a; --sent: #0f2e22;
  --ok: #86efac; --warn: #fcd34d;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { cursor: pointer; }
h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
h2 { font-size: 1.05rem; margin: 1rem 0 .5rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: .8rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.top { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--brand-ink); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-weight: 700; letter-spacing: .02em; display: flex; gap: 8px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
.who { font-size: .9rem; opacity: .9; }

.view { padding: 12px 12px 8px; max-width: 720px; margin: 0 auto; }

.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.tabs button { flex: 1; border: 0; background: none; padding: 8px 0 6px; font-size: .8rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; }
.tabs button .ico { font-size: 1.3rem; line-height: 1; }
.tabs button.active { color: var(--accent); font-weight: 600; }

.card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.btn { min-height: var(--tap); padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: .9rem; }
.btn:disabled { opacity: .5; }

label.field { display: block; margin-bottom: 10px; }
label.field > span, .field-label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.input, input[type=text], input[type=number], input[type=date], input[type=email], input[type=time], select, textarea { width: 100%; min-height: var(--tap); padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); }
textarea { min-height: 84px; resize: vertical; }
input[type=number] { text-align: center; font-size: 1.1rem; font-weight: 600; }

.picker { width: 100%; min-height: var(--tap); padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.picker .val { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker .val.empty { color: var(--muted); font-weight: 400; }
.picker .chev { color: var(--muted); }

.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--field); }
.stepper button { width: 44px; min-height: var(--tap); border: 0; background: var(--field-2); font-size: 1.3rem; }
.stepper input { border: 0; border-radius: 0; flex: 1; min-width: 0; padding-left: 2px; padding-right: 2px; }
.grid3 .stepper button { width: 34px; font-size: 1.1rem; }
.grid3 label.field > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.line { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; }
.line:first-of-type { border-top: 0; }
.line .job { font-weight: 700; }
.line .cc { color: var(--ink); }
.line .desc { color: var(--muted); font-size: .9rem; grid-column: 1 / -1; white-space: pre-wrap; }
.line .hrs { text-align: right; font-weight: 700; white-space: nowrap; }
.line .eq { text-align: right; color: var(--accent); font-size: .9rem; white-space: nowrap; }
.tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--tag-bg); color: var(--tag-ink); margin-right: 4px; }
.tag.eq { background: var(--tag-eq-bg); color: var(--tag-eq-ink); }
.tag.ok { background: var(--tag-ok-bg); color: var(--ok); }
.tag.warn { background: var(--tag-warn-bg); color: var(--warn); }

.total { font-size: 1.6rem; font-weight: 800; }
.total small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.warn-text { color: var(--warn); font-size: .9rem; }
.bad-text { color: var(--bad); font-size: .9rem; }

.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.daynav .btn { min-width: 48px; }
.daynav input[type=date] { text-align: center; font-weight: 700; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--field); border-radius: 999px; padding: 8px 14px; min-height: 40px; }
.chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

.list { max-height: 55vh; overflow: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
.list .item { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--field); padding: 12px; display: flex; gap: 10px; align-items: baseline; min-height: var(--tap); }
.list .item:last-child { border-bottom: 0; }
.list .item .code { font-weight: 700; min-width: 64px; font-variant-numeric: tabular-nums; }
.list .item .name { flex: 1; }
.list .item .cat { color: var(--muted); font-size: .75rem; }
.list .group { padding: 6px 12px; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--group); position: sticky; top: 0; }
.list .item.sel { background: var(--sel); }

.period-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.pday { border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 6px 2px; text-align: center; min-height: 58px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.pday .d { font-size: .7rem; color: var(--muted); }
.pday .n { font-weight: 700; }
.pday .h { font-size: .8rem; color: var(--accent); font-weight: 600; }
.pday.today { outline: 2px solid var(--accent); }
.pday.empty .n { color: var(--muted); font-weight: 400; }
.pday.sent { background: var(--sent); }

table.sum { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.sum th, table.sum td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.sum td.num, table.sum th.num { text-align: right; font-variant-numeric: tabular-nums; }

.sheet[hidden] { display: none; }
.sheet { position: fixed; inset: 0; z-index: 20; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 8px 14px calc(16px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
.sheet-grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet h1 { margin-bottom: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--brand); color: var(--brand-ink); padding: 10px 16px; border-radius: 999px; z-index: 30; font-size: .9rem; box-shadow: 0 4px 14px rgba(0,0,0,.25); max-width: 92vw; }
.toast[hidden] { display: none; }

pre.preview { background: #111827; color: #e5e7eb; padding: 12px; border-radius: 12px; font-size: .75rem; overflow: auto; white-space: pre-wrap; word-break: break-word; max-height: 40vh; }
.empty-state { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty-state .big { font-size: 2.2rem; }
kbd { background: var(--tag-bg); border-radius: 6px; padding: 1px 6px; font-size: .85em; }
@media (min-width: 600px) { .view { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>

<script>
/* RAM Timecard: a single-file, offline-first daily timecard.
   Data lives on the phone (localStorage). A card is sent as plain text with a machine-readable block that the
   finance system (finance/ramfin, `timecards` module) reads straight into the timesheet tables. */
(() => {
  'use strict';
  const STORE = 'ramtc.v1';
  const REF_CACHE = 'ramtc.ref';
  const $ = (sel, el = document) => el.querySelector(sel);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v === false || v == null || (k === 'disabled' && !v)) continue;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };

  // ------------------------------------------------------------------ dates
  const pad = (n) => String(n).padStart(2, '0');
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const parseISO = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
  const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  const fmt = (iso, opts = { weekday: 'short', month: 'short', day: 'numeric' }) => parseISO(iso).toLocaleDateString('en-CA', opts);
  const periodEnd = (iso) => {
    const pp = REF.payPeriod; const diff = daysBetween(pp.anchorEnd, iso);
    return addDays(pp.anchorEnd, pp.days * Math.ceil(diff / pp.days));
  };
  const periodDays = (pe) => Array.from({ length: REF.payPeriod.days }, (_, i) => addDays(pe, i - (REF.payPeriod.days - 1)));

  // ------------------------------------------------------------------ state
  const blank = () => ({ profile: { name: '', position: '', supervisor: '', defaultJob: '', submitTo: '' }, days: {}, recents: { codes: [], units: [], jobs: [] }, sent: {} });
  let state = blank();
  try { const raw = localStorage.getItem(STORE); if (raw) state = Object.assign(blank(), JSON.parse(raw)); } catch (e) { /* fresh start */ }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { toast('Could not save on this phone (storage full or blocked)'); } };
  const uid = () => Math.random().toString(36).slice(2, 9);
  const num = (v) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? Math.round(n * 4) / 4 : 0; };
  const fmtH = (n) => (Math.round(n * 100) / 100).toString();

  let REF = null;
  const ui = { tab: 'day', date: todayISO() };

  const getDay = (iso) => state.days[iso] || (state.days[iso] = { date: iso, lines: [], loa: false, pu: false, km: 0, notes: '' });
  const dayHours = (d) => d.lines.reduce((a, l) => ({ reg: a.reg + l.reg, ot: a.ot + l.ot, dt: a.dt + l.dt, eq: a.eq + (l.unit ? l.eq : 0) }), { reg: 0, ot: 0, dt: 0, eq: 0 });
  const labour = (l) => l.reg + l.ot + l.dt;
  const hasWork = (d) => d && (d.lines.length || d.loa || d.pu || d.km);
  const jobName = (no) => (REF.jobs.find((j) => j.no === no) || {}).name || '';
  const codeDesc = (cc) => (REF.costCodes.find((c) => c.code === cc) || {}).desc || '';
  const unitType = (u) => (REF.equipment.find((e) => e.unit === u) || {}).type || '';
  const remember = (list, key, max = 8) => { const i = list.indexOf(key); if (i >= 0) list.splice(i, 1); list.unshift(key); list.length = Math.min(list.length, max); };

  // ------------------------------------------------------------------ validation
  const problems = (d) => {
    const out = [];
    if (!state.profile.name.trim()) out.push('Add your name under Me before sending.');
    if (!d.lines.length && !d.loa && !d.pu && !d.km) out.push('Nothing on this day yet.');
    d.lines.forEach((l, i) => {
      if (!l.job) out.push(`Line ${i + 1}: pick a job.`);
      if (!l.cc) out.push(`Line ${i + 1}: pick a cost code.`);
      if (!labour(l) && !(l.unit && l.eq)) out.push(`Line ${i + 1}: no hours.`);
      if (l.unit && l.eq > labour(l) && labour(l) > 0) out.push(`Line ${i + 1}: ${l.unit} has more hours than you do on that line. Fine if someone else ran it too, otherwise check it.`);
    });
    const t = dayHours(d);
    if (t.reg + t.ot + t.dt > REF.maxHoursDay) out.push(`${fmtH(t.reg + t.ot + t.dt)} hours in one day. Check it before sending.`);
    return out;
  };

  // ------------------------------------------------------------------ output
  const buildText = (days) => {
    const p = state.profile;
    const pe = periodEnd(days[0].date);
    const L = [];
    L.push('RAM EXCAVATING TIMECARD');
    L.push(`Employee: ${p.name}${p.position ? ' (' + p.position + ')' : ''}`);
    if (p.supervisor) L.push(`Supervisor: ${p.supervisor}`);
    L.push(`Pay period end: ${pe} (${fmt(pe, { month: 'short', day: 'numeric', year: 'numeric' })})`);
    L.push('');
    let reg = 0, ot = 0, dt = 0, eq = 0, loa = 0, pu = 0, km = 0;
    for (const d of days) {
      const t = dayHours(d); reg += t.reg; ot += t.ot; dt += t.dt; eq += t.eq; loa += d.loa ? 1 : 0; pu += d.pu ? 1 : 0; km += d.km || 0;
      L.push(`${fmt(d.date, { weekday: 'long', month: 'long', day: 'numeric' })}  Reg ${fmtH(t.reg)}  OT ${fmtH(t.ot)}  DT ${fmtH(t.dt)}  Equip ${fmtH(t.eq)}`);
      for (const l of d.lines) {
        const bits = [`${l.job} ${jobName(l.job)}`.trim(), `${l.cc} ${codeDesc(l.cc)}`.trim()];
        const hrs = []; if (l.reg) hrs.push(`${fmtH(l.reg)} reg`); if (l.ot) hrs.push(`${fmtH(l.ot)} OT`); if (l.dt) hrs.push(`${fmtH(l.dt)} DT`);
        bits.push(hrs.join(' + ') || 'no labour');
        if (l.unit) bits.push(`${l.unit} ${fmtH(l.eq)} h`);
        L.push('  - ' + bits.join(' | ') + (l.desc ? `\n    ${l.desc.replace(/\n/g, '\n    ')}` : ''));
      }
      const extras = []; if (d.loa) extras.push('LOA'); if (d.pu) extras.push('P/U truck'); if (d.km) extras.push(`Travel ${d.km} km`);
      if (extras.length) L.push('  ' + extras.join(' | '));
      if (d.notes) L.push('  Notes: ' + d.notes.replace(/\n/g, ' '));
      L.push('');
    }
    if (days.length > 1) L.push(`TOTALS  Reg ${fmtH(reg)}  OT ${fmtH(ot)}  DT ${fmtH(dt)}  Equip ${fmtH(eq)}  LOA ${loa}  P/U ${pu}  Travel ${km} km`);
    L.push('');
    L.push('--RAMTC1--');
    L.push(JSON.stringify(buildPayload(days, pe)));
    L.push('--END--');
    return L.join('\n');
  };
  const buildPayload = (days, pe) => ({
    v: 1, employee: state.profile.name.trim(), position: state.profile.position || undefined, supervisor: state.profile.supervisor || undefined,
    periodEnd: pe, sentAt: new Date().toISOString(),
    days: days.map((d) => ({
      date: d.date, loa: !!d.loa, pu: !!d.pu, km: d.km || 0, notes: d.notes || undefined,
      lines: d.lines.map((l) => ({ job: l.job, cc: l.cc, reg: l.reg, ot: l.ot, dt: l.dt, unit: l.unit || undefined, eq: l.unit ? l.eq : undefined, desc: l.desc || undefined })),
    })),
  });
  const subjectFor = (days) => `RAM Timecard | ${state.profile.name.trim()} | ${days.length === 1 ? days[0].date : 'PP ' + periodEnd(days[0].date)}`;

  async function send(days, how) {
    const text = buildText(days); const subject = subjectFor(days); const to = state.profile.submitTo || REF.submitTo;
    const mark = () => { const ts = new Date().toISOString(); days.forEach((d) => { state.sent[d.date] = ts; }); save(); render(); };
    if (how === 'copy') {
      try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into an email or text to the office.'); mark(); }
      catch (e) { openSheet(h('div', {}, h('h1', {}, 'Copy this'), h('pre', { class: 'preview' }, text))); }
      return;
    }
    if (how === 'share' && navigator.share) {
      const fname = `${subject.replace(/[^A-Za-z0-9]+/g, '_')}.txt`;
      try {
        const file = new File([text], fname, { type: 'text/plain' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ title: subject, text: `${subject}\n\n${text}`, files: [file] });

      if (force) toast(`Lists updated (${REF.version})`);
    } catch (e) {
      if (window.__RAMTC_REF) { REF = window.__RAMTC_REF; toast('This copy has its lists built in. Get the newest copy from the office to update them.'); render(); return; }
      const cached = localStorage.getItem(REF_CACHE);
      if (cached) { REF = JSON.parse(cached); if (force) toast('No signal. Using the last lists you had.'); }
      else { $('#view').replaceChildren(h('div', { class: 'empty-state' }, 'Could not load the job and cost code lists. Connect to the internet once and reopen.')); return; }
    }
    if (!state.profile.name && ui.tab === 'day' && !Object.keys(state.days).length) ui.tab = 'settings';
    render();
  }
  if ('serviceWorker' in navigator && !window.__RAMTC_REF && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  loadRef(false);
})();

</script>
</body>
</html>
